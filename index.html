<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <title>Cafe Stitch Menu</title>
  <style>
    :root{
      --blue:#5b80a8; --blue2:#cfe2ef; --lav:#a58ab9; --pink:#efcad8;
      --cream:#fbfaf7; --ink:#24384f; --muted:#7a8795; --line:#dde2e6;
      --shadow:0 10px 30px rgba(36,56,79,.08);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}
    button{font:inherit}
    .shell{max-width:680px;margin:0 auto;min-height:100vh;background:
      radial-gradient(circle at 10% 8%,rgba(207,226,239,.78) 0 14%,transparent 15%),
      radial-gradient(circle at 91% 12%,rgba(239,202,216,.65) 0 16%,transparent 17%),
      var(--cream)}
    .hero{padding:42px 20px 24px;text-align:center}
    .mark{width:78px;height:78px;border:2px solid var(--blue);border-radius:28px;margin:auto;display:grid;place-items:center;font-weight:800;font-size:23px;color:var(--blue);background:rgba(255,255,255,.55)}
    .brand{font-size:31px;font-weight:800;margin-top:13px}
    .tag{font-size:12px;letter-spacing:3px;color:var(--lav);margin-top:5px}
    .tabs-wrap{position:sticky;top:0;z-index:20;padding:8px 14px 10px;background:rgba(251,250,247,.88);backdrop-filter:blur(12px)}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.82)}
    .tab{border:0;border-radius:13px;padding:12px 8px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
    .tab.active{background:var(--blue);color:#fff}
    .content{padding:12px 14px 44px}
    .section{display:none}.section.active{display:block}
    .category{margin:12px 0;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.82);overflow:hidden;box-shadow:var(--shadow)}
    .category-head{width:100%;border:0;background:transparent;color:var(--ink);padding:17px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;text-align:left}
    .category-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;font-weight:800;font-size:17px}
    .category-title .ar{direction:rtl;font-weight:700;color:var(--lav);font-size:15px}
    .chev{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--blue2);transition:transform .2s ease}
    .category.open .chev{transform:rotate(180deg)}
    .products{display:none;border-top:1px solid var(--line)}
    .category.open .products{display:block}
    .product{display:grid;grid-template-columns:74px 1fr auto;gap:13px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
    .product:last-child{border-bottom:0}
    .product-img{width:74px;height:74px;border-radius:16px;object-fit:cover;background:linear-gradient(135deg,var(--pink),var(--blue2));display:block}
    .names{min-width:0}
    .name-en{font-weight:800;font-size:15px;line-height:1.25}
    .name-ar{margin-top:5px;direction:rtl;text-align:left;color:var(--muted);font-size:14px;line-height:1.25}
    .price{font-size:16px;font-weight:800;white-space:nowrap;color:var(--blue)}
    .status{padding:30px 18px;text-align:center;color:var(--muted)}
    .footer{padding:8px 20px 34px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.4px}
    @media (max-width:420px){
      .hero{padding-top:34px}.brand{font-size:28px}
      .product{grid-template-columns:66px 1fr auto;padding:12px}
      .product-img{width:66px;height:66px}.name-en{font-size:14px}.name-ar{font-size:13px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="mark">CS</div>
      <div class="brand">Cafe Stitch</div>
      <div class="tag">MENU</div>
    </header>

    <div class="tabs-wrap">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="drinks" aria-selected="true">DRINKS | مشروبات</button>
        <button class="tab" data-tab="sweets" aria-selected="false">SWEETS | حلويات</button>
      </div>
    </div>

    <section class="content">
      <div id="drinks" class="section active"></div>
      <div id="sweets" class="section"></div>
      <div id="status" class="status">Loading menu…</div>
    </section>

    <div class="footer">CAFE STITCH</div>
  </main>

  <script>
    const fallbackImage = 'generic_placeholder.jpg';

    function normalizeImagePath(path){
      if(!path) return fallbackImage;
      if(/^https?:\/\//i.test(path)) return path;
      return String(path).replace(/^\.?\//,'') || fallbackImage;
    }

    function productRow(product){
      const row = document.createElement('div');
      row.className = 'product';

      const img = document.createElement('img');
      img.className = 'product-img';
      img.loading = 'lazy';
      img.alt = product.name_en || '';
      img.src = normalizeImagePath(product.image);
      img.onerror = () => {
        if(!img.dataset.fallback){
          img.dataset.fallback = '1';
          img.src = fallbackImage;
        }
      };

      const names = document.createElement('div');
      names.className = 'names';

      const en = document.createElement('div');
      en.className = 'name-en';
      en.textContent = product.name_en || '';

      const ar = document.createElement('div');
      ar.className = 'name-ar';
      ar.textContent = product.name_ar || '';

      names.append(en, ar);

      const price = document.createElement('div');
      price.className = 'price';
      price.textContent = `${product.price ?? ''}₪`;

      row.append(img, names, price);
      return row;
    }

    function categoryCard(category){
      const card = document.createElement('article');
      card.className = 'category';

      const head = document.createElement('button');
      head.className = 'category-head';
      head.type = 'button';

      const title = document.createElement('div');
      title.className = 'category-title';

      const en = document.createElement('span');
      en.textContent = category.category_en || '';

      const sep = document.createElement('span');
      sep.textContent = '|';
      sep.style.color = 'var(--line)';

      const ar = document.createElement('span');
      ar.className = 'ar';
      ar.textContent = category.category_ar || '';

      const chev = document.createElement('span');
      chev.className = 'chev';
      chev.textContent = '⌄';

      title.append(en, sep, ar);
      head.append(title, chev);

      const products = document.createElement('div');
      products.className = 'products';
      (category.products || []).forEach(p => products.appendChild(productRow(p)));

      head.addEventListener('click', () => {
        const parent = card.parentElement;
        parent.querySelectorAll('.category.open').forEach(other => {
          if(other !== card) other.classList.remove('open');
        });
        card.classList.toggle('open');
      });

      card.append(head, products);
      return card;
    }

    function renderSection(id, categories){
      const target = document.getElementById(id);
      target.innerHTML = '';
      (categories || []).forEach(c => target.appendChild(categoryCard(c)));
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => {
          t.classList.toggle('active', t === tab);
          t.setAttribute('aria-selected', t === tab ? 'true' : 'false');
        });
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    fetch('./menu.json', {cache:'no-store'})
      .then(r => {
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => {
        renderSection('drinks', data.drinks);
        renderSection('sweets', data.sweets);
        document.getElementById('status').style.display = 'none';
      })
      .catch(err => {
        console.error(err);
        document.getElementById('status').textContent = 'Menu could not be loaded. Please refresh the page.';
      });
  </script>
</body>
</html>
