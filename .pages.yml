media:
  input: .
  output: /
  extensions: [jpg, jpeg, png, webp]

content:
  - name: menu
    label: Cafe Stitch Menu
    type: file
    path: menu.json
    format: json

    fields:
      - name: drinks
        label: DRINKS | مشروبات
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{category_en} | {category_ar}"
        fields:
          - name: category_en
            label: Category English
            type: string

          - name: category_ar
            label: Category Arabic
            type: string

          - name: products
            label: Products
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name_en} — {price}₪"
            fields:
              - name: name_en
                label: Product Name English
                type: string
                required: true

              - name: name_ar
                label: Product Name Arabic
                type: string
                required: true

              - name: price
                label: Price ₪
                type: number
                required: true

              - name: image
                label: Product Image
                type: image

      - name: sweets
        label: SWEETS | حلويات
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{category_en} | {category_ar}"
        fields:
          - name: category_en
            label: Category English
            type: string

          - name: category_ar
            label: Category Arabic
            type: string

          - name: products
            label: Products
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name_en} — {price}₪"
            fields:
              - name: name_en
                label: Product Name English
                type: string
                required: true

              - name: name_ar
                label: Product Name Arabic
                type: string
                required: true

              - name: price
                label: Price ₪
                type: number
                required: true

              - name: image
                label: Product Image
                type: image